[profile.default]
src = "."
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Solidity compiler version
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false

# Remappings
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

# Test settings
verbosity = 2

# Fuzz testing
[profile.default.fuzz]
runs = 256

[profile.ci]
fuzz = { runs = 5000 }
